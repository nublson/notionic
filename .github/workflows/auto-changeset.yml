name: Auto Changeset

# Writes a changeset for each change to the notionic package that lands on
# develop (see .github/scripts/auto-changeset.sh), so the next Release can
# bump the version and write the changelog. Same idea as nublson/quiver's
# auto-changeset.yml, with one changeset per pull request instead of one per
# release.
#
# Pushes as the repository's GitHub App, which the develop ruleset lets
# bypass its pull request rule.

on:
  push:
    branches:
      - develop

concurrency:
  group: auto-changeset
  cancel-in-progress: false

jobs:
  auto-changeset:
    name: 📝 Auto Changeset
    runs-on: ubuntu-latest
    # The app's pushes trigger workflows: skip its own commits.
    if: >-
      !startsWith(github.event.head_commit.message, 'chore: add changesets') &&
      !startsWith(github.event.head_commit.message, 'chore: version packages')
    permissions:
      contents: read
    steps:
      - name: Get a token for the GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Write changesets
        id: changesets
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/auto-changeset.sh

      - name: Commit and push changesets
        if: steps.changesets.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/${BOT}" --jq .id)+${BOT}@users.noreply.github.com"
          git add .changeset/
          git commit -m "chore: add changesets"
          # Another merge may have landed while this ran.
          git pull --rebase origin develop
          git push origin develop
