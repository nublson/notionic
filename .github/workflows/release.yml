name: Release

# Ships develop to production, like nublson/quiver's and purl's release.yml:
#   1. Versions the package on develop: `changeset version` turns the pending
#      changesets (written by auto-changeset.yml) into a version bump and
#      CHANGELOG.md entries.
#   2. Merges develop into main.
#   3. Builds, typechecks and tests main, and publishes the
#      `release/build-validation` status that gates Vercel's production deploy
#      of notionic.dev.
#   4. Makes sure Vercel deploys that commit: if its GitHub integration never
#      picked up the push, triggers the Deploy Hook for main.
#   5. Tags a new version and creates its GitHub release from its changelog
#      entry, and, separately, publishes packages/notionic to npm if its
#      version isn't published yet.
#
# With no pending changesets, it still ships the site and publishes nothing.
#
# The version commit and the merge are pushed as the repository's GitHub App, which the main ruleset
# and develop rulesets let bypass their pull request rule: repository variable RELEASE_APP_CLIENT_ID
# and secret RELEASE_APP_PRIVATE_KEY (the app needs Contents: read and write).
#
# The fallback deploy needs secret VERCEL_DEPLOY_HOOK_URL: a Vercel Deploy Hook for the main branch.
#
# npm auth is keyless: npm's trusted publishing via GitHub OIDC, configured on
# npmjs.com for nublson/notionic and this workflow file. No token secret.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get a token for the GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version and update changelog
        id: version
        env:
          # @changesets/changelog-github reads PRs and authors for the entries.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PREVIOUS=$(jq -r .version packages/notionic/package.json)
          # `changeset version` fails when there's nothing to release.
          if ls .changeset/*.md 2>/dev/null | grep -qv '/README\.md$'; then
            pnpm changeset version
          fi
          CURRENT=$(jq -r .version packages/notionic/package.json)
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"
          if [ "$PREVIOUS" = "$CURRENT" ]; then
            echo "No pending changesets: notionic stays at ${CURRENT}."
          else
            echo "notionic: ${PREVIOUS} -> ${CURRENT}"
          fi

      - name: Commit and push the version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --deleted --others --exclude-standard)" ]; then
            exit 0
          fi
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/${BOT}" --jq .id)+${BOT}@users.noreply.github.com"
          git add -A
          git commit -m "chore: version packages (notionic v${VERSION})"
          git push origin develop

  merge-develop:
    name: Merge develop into main
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    steps:
      - name: Get a token for the GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/${BOT}" --jq .id)+${BOT}@users.noreply.github.com"

      - name: Fetch latest changes
        run: |
          git fetch origin main
          git fetch origin develop

      - name: Checkout main branch
        run: git checkout main

      - name: Merge develop into main
        # Compares main's version with develop's rather than trusting the
        # version job's bump, so a rerun after a failed merge still names it.
        run: |
          MAIN_VERSION=$(git show origin/main:packages/notionic/package.json | jq -r .version)
          DEVELOP_VERSION=$(git show origin/develop:packages/notionic/package.json | jq -r .version)
          if [ "$MAIN_VERSION" = "$DEVELOP_VERSION" ]; then
            MESSAGE="chore: release (no new notionic version)"
          else
            MESSAGE="chore: release notionic v${DEVELOP_VERSION}"
          fi
          git merge origin/develop --no-ff -m "$MESSAGE"

      - name: Push merge to main
        run: git push origin main

  validate-build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: merge-develop
    permissions:
      contents: read
      statuses: write
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck and test
        run: pnpm turbo run build typecheck test

      - name: Publish deploy gate status for Vercel
        id: gate
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          if [ "${{ job.status }}" = "success" ]; then
            STATE=success
          else
            STATE=failure
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${{ github.repository }}/statuses/${SHA}" \
            -f "state=${STATE}" \
            -f context="release/build-validation" \
            -f description="Release workflow Build Validation"

  ensure-deploy:
    name: Ensure production deploy
    runs-on: ubuntu-latest
    needs: validate-build
    permissions:
      statuses: read
    steps:
      # Vercel's GitHub integration sometimes misses a push to main (v0.4.0's
      # never got a deployment). It reports a `Vercel` commit status as soon as
      # it starts a deployment, so no status for a few minutes means it missed
      # it. The hook's deployment still waits for release/build-validation.
      - name: Trigger the Deploy Hook if Vercel missed the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.validate-build.outputs.sha }}
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          for attempt in $(seq 1 12); do
            COUNT=$(gh api "repos/${{ github.repository }}/commits/${SHA}/statuses" --paginate \
              --jq '[.[] | select(.creator.login == "vercel[bot]" and (.context | startswith("Vercel")))] | length' \
              | awk '{n += $1} END {print n + 0}')
            if [ "$COUNT" -gt 0 ]; then
              echo "Vercel is deploying ${SHA}."
              exit 0
            fi
            sleep 15
          done
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::Vercel has no deployment for ${SHA} and secret VERCEL_DEPLOY_HOOK_URL isn't set. Redeploy main from Vercel."
            exit 1
          fi
          echo "::warning::Vercel has no deployment for ${SHA} after 3 minutes: triggering the Deploy Hook for main."
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate-build
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is published
        id: check
        working-directory: packages/notionic
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if npm view "notionic@${VERSION}" version > /dev/null 2>&1; then
            echo "::notice::notionic ${VERSION} is already on npm. Changes to packages/notionic on develop bump it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter notionic build

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        working-directory: packages/notionic
        run: npm publish --provenance --access public

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: validate-build
    permissions:
      contents: write # tag and GitHub release
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Independent of npm: a release that fails to publish still gets its
      # tag and notes. A release with no new version (site only) skips this.
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version packages/notionic/package.json)
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::notice::${TAG} is already tagged: no new notionic version in this release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          # This version's changelog entry: from its `## ` heading to the next.
          awk '/^## /{n++} n==1 && !/^## /{print} n==2{exit}' packages/notionic/CHANGELOG.md > notes.md
          gh release create "$TAG" --title "notionic ${TAG}" --notes-file notes.md --latest
