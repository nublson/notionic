name: CI

on:
  # Pull requests only. develop's code changes only through merged PRs, which
  # ran this already (its other pushes are changeset notes and Release's version
  # bump); main changes only through Release, whose Build Validation job builds,
  # typechecks and tests the release commit before it deploys or publishes.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm turbo run build typecheck test

  # Every shadcn registry item, installed into a fresh shadcn app with the
  # local notionic build, then typechecked and built.
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # npm cache for the fresh app's installs (it has no lockfile to key on).
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: registry-npm-${{ hashFiles('apps/web/registry.json', 'pnpm-lock.yaml') }}
          restore-keys: registry-npm-

      - run: pnpm install --frozen-lockfile

      - run: bash scripts/check-registry.sh
